[package]
name = "night-shift-coordinator"
version = "0.1.0"
edition = "2024"
description = "Local Rust CLI for supervising prepared Night Shift slice execution"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/nanomader/night-shift-coordinator"

[[bin]]
name = "nsc"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.5.53", features = ["derive"] }
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.23.0"
